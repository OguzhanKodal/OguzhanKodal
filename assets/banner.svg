<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171A"/>
      <stop offset="1" stop-color="#1E2030"/>
    </linearGradient>
    <linearGradient id="seri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E6FF0"/>
      <stop offset="0.33" stop-color="#E8C468"/>
      <stop offset="0.66" stop-color="#C2693E"/>
      <stop offset="1" stop-color="#4F7F5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E6FF0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3E6FF0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F4F1EC" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Schibsted Grotesk", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .edge { stroke-dasharray: 6 8; animation: flow 4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -112 } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1000" cy="160" r="220" fill="url(#glow)"/>

  <!-- sinir ağı -->
  <g stroke="#3E6FF0" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path class="edge" d="M880 90 L990 60 M880 90 L990 160 M880 230 L990 160 M880 230 L990 260 M990 60 L1100 110 M990 160 L1100 110 M990 160 L1100 210 M990 260 L1100 210 M880 160 L990 60 M880 160 L990 260"/>
  </g>
  <g>
    <circle class="node" cx="880" cy="90" r="9" fill="#3E6FF0"/>
    <circle class="node n2" cx="880" cy="160" r="9" fill="#E8C468"/>
    <circle class="node n3" cx="880" cy="230" r="9" fill="#3E6FF0"/>
    <circle class="node n4" cx="990" cy="60" r="11" fill="#C2693E"/>
    <circle class="node n1" cx="990" cy="160" r="13" fill="#E8C468"/>
    <circle class="node n5" cx="990" cy="260" r="11" fill="#4F7F5F"/>
    <circle class="node n3" cx="1100" cy="110" r="10" fill="#3E6FF0"/>
    <circle class="node n2" cx="1100" cy="210" r="10" fill="#4F7F5F"/>
  </g>

  <!-- o/ işareti -->
  <text x="70" y="120" class="mono" font-size="64" font-weight="700" fill="#F4F1EC">o<tspan fill="url(#seri)">/</tspan></text>

  <text x="70" y="200" class="sans" font-size="58" font-weight="900" fill="#F4F1EC" letter-spacing="-1.5">Oğuzhan Kodal</text>
  <rect x="72" y="222" width="420" height="4" rx="2" fill="url(#seri)"/>
  <text x="70" y="268" class="mono" font-size="24" fill="#A09C95">&gt; <tspan fill="#E8C468">AI Engineer</tspan> · mobile &amp; web dev<tspan class="cursor" fill="#E8C468">▍</tspan></text>
</svg>
